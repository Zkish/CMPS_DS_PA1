// 1. Implement the stack data structure described in the book. Instead of

function Stack() {
  var items = []; 

  this.push = function(element) {
    items.push(element);
  };

  this.pop = function() {
    return items.pop();
  };

  this.peek = function() {
    return items[items.length - 1];
  };

  this.isEmpty = function() {
    return items.length === 0;
  };

  this.size = function() {
    return items.length;
  };

  this.clear = function() {
    items = [];
  };
}

// 1. Implement the queue data structure described in the book. Instead of
//    using 'let items = [];' use 'var items = []'. Note that this
//    implementation does not use the prototype (see project).

function Queue() {
  var items = [];  // no prototype array

  // add element to the back of the queue
  this.enqueue = function(element) {
    items.push(element);
  };

  // remove and return the element at the front
  this.dequeue = function() {
    return items.shift();
  };

  // return the first element without removing it
  this.front = function() {
    return items[0];
  };

  // return true if queue is empty
  this.isEmpty = function() {
    return items.length === 0;
  };

  // return the number of items in the queue
  this.size = function() {
    return items.length;
  };

  //return a string representation 
  this.print = function() {
    console.log(items.toString());
  };
}

// The priority queue //

console.log("The priority queue");

// The following class is used below.

function QueueElement(element, priority) {
  this.element = element;
  this.priority = priority;
}

// 1. Finish the implementation below for the priority queue. Note that this
//    implementation does not use the prototype.

function PriorityQueue() {
  var items = [];

  this.enqueue = function(element, priority) {
    // we need to create a queue element that stores the priority as well
    var queueElement = new QueueElement(element, priority);

    // insert into priority queue (min-priority queue)
    var inserted = false;

    for (var i = 0; i < items.length; i++) {
      if (queueElement.priority < items[i].priority) {
        items.splice(i, 0, queueElement);
        inserted = true;
        break;
      }
    }

    if (!inserted) {
      items.push(queueElement);
    }
  };

  // remove and return the element with the highest priority (lowest number)
  this.dequeue = function() {
    return items.shift();
  };

  // return the item at the front without removing it
  this.front = function() {
    return items[0];
  };

  // return true if queue is empty
  this.isEmpty = function() {
    return items.length === 0;
  };

  // return number of items
  this.size = function() {
    return items.length;
  };

  // helper function to print contents
  this.print = function() {
    for (var i = 0; i < items.length; i++) {
      console.log(`${items[i].element} - ${items[i].priority}`);
    }
  };

}

// 1. Finish the implementation for the hot potato game. nameList contains the
//    names of the participants, and num is how many times the potato is passed
//    before a participant is ejected from the game (the one that holds the
//    potato). Note that this is effectively a simulation of the game.

function hotPotato(nameList, num) {
  // create a queue to store the names
  // ...
  const queue = [];

  // add the names to the queue
  // ...
  for (let i = 0; i < nameList.length; i++) {
    queue.push(nameList[i]);
  }

 // while there is more than one person left
  while (queue.length > 1) {
    // pass the "potato" num times
    for (let i = 0; i < num; i++) {
      // dequeue front, enqueue to back
      queue.push(queue.shift());
    }

    // eject the person holding the potato
    const eliminated = queue.shift();
    console.log(`${eliminated} was eliminated from the game.`);
  }

  // last remaining person is the winner
  return queue[0];
}
