console.log("The stack data structure");

// 1. Implement the stack data structure described in the book. Instead of
//    using 'let items = [];' use 'var items = []'. Note that this
//    implementation does not use the prototype (see project).

function Stack() {
  var items = []; 

  this.push = function(element) {
    items.push(element);
  };

  this.pop = function() {
    return items.pop();
  };

  this.peek = function() {
    return items[items.length - 1];
  };

  this.isEmpty = function() {
    return items.length === 0;
  };

  this.size = function() {
    return items.length;
  };

  this.clear = function() {
    items = [];
  };
}

console.log("Top now:", stack.peek());     

console.log("Is stack empty?", stack.isEmpty()); 

stack.clear();
console.log("Stack cleared. Empty now?", stack.isEmpty());
