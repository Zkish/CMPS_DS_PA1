// 1. Implement the tree data structure using the prototype (see below). Note
//    that we have helper functions that we have to deal with, and we simply

//    below. This is a common convention/solution. Programmers using a tree
//    object are not supposed to use _ methods (or properties) directly. Run
//    some tests that show that your code works.

function Node(key) {
  this.key = key;
  this.left = null;
  this.right = null;
}

function BinarySearchTree() {
  this.root = null;
}

// helper function for insertion
BinarySearchTree.prototype._insertNode = function(node, newNode) {
  if (newNode.key < node.key) {
    if (node.left === null) {
      node.left = newNode;
    } else {
      this._insertNode(node.left, newNode);
    }
  } else {
    if (node.right === null) {
      node.right = newNode;
    } else {
      this._insertNode(node.right, newNode);
    }
  }
};

// insert method
BinarySearchTree.prototype.insert = function(key) {
  var newNode = new Node(key);
  if (this.root === null) {       // fixed making root 
    this.root = newNode;          
  } else {
    this._insertNode(this.root, newNode);
  }
};

// in-order traversal print
BinarySearchTree.prototype._inOrderTraverseNode = function(node, callback) {
  if (node !== null) {
    this._inOrderTraverseNode(node.left, callback);
    callback(node.key);
    this._inOrderTraverseNode(node.right, callback);
  }
};

// public print method
BinarySearchTree.prototype.print = function() {
  this._inOrderTraverseNode(this.root, printNode);
};

// Pre-order traversal helper (recursive)
BinarySearchTree.prototype._preOrderTraverseNode = function(node, callback) {
  if (node !== null) {
    callback(node.key);                               // visit node first
    this._preOrderTraverseNode(node.left, callback);  // traverse left subtree
    this._preOrderTraverseNode(node.right, callback); // traverse right subtree
  }
};

// pre order methods
BinarySearchTree.prototype.preOrderTraverse = function(callback) {
  this._preOrderTraverseNode(this.root, callback);
};

// Min method
BinarySearchTree.prototype.min = function() {
  if (this.root === null) return null; // tree is empty

  var current = this.root;
  while (current.left !== null) {
    current = current.left; // keep going left
  }
  return current.key; // leftmost node's key
};

// 7. Implement the search method using the prototype and show that it works.
// Search helper (recursive)
BinarySearchTree.prototype._searchNode = function(node, key) {
  if (node === null) {
    return false; // not found
  }
  if (key === node.key) {
    return true; // found
  } else if (key < node.key) {
    return this._searchNode(node.left, key); // search left
  } else {
    return this._searchNode(node.right, key); // search right
  }
};

// Public search method
BinarySearchTree.prototype.search = function(key) {
  return this._searchNode(this.root, key);
};

// 11 Iterate through the array and insert each element inside a new tree. make

// Function to build a balanced BST from a sorted array
function buildBalancedBST(sortedArray) {
  var tree = new BinarySearchTree();

  function insertMiddle(arr) {
    if (arr.length === 0) return;

    var mid = Math.floor(arr.length / 2);
    tree.insert(arr[mid]); // insert middle element first

    insertMiddle(arr.slice(0, mid));     // left half
    insertMiddle(arr.slice(mid + 1));    // right half
  }

  insertMiddle(sortedArray);
  return tree;
}

// 12 Implement the graph data structure using the prototype.
// Graph constructor
function Graph() {
  this.adjList = {}; 
  this.vertices = []; 
}

// Add a vertex
Graph.prototype.addVertex = function(v) {
  if (!this.adjList[v]) {
    this.adjList[v] = [];
    this.vertices.push(v);
  }
};

// Add an edge
Graph.prototype.addEdge = function(v, w) {
  if (!this.adjList[v]) this.addVertex(v);
  if (!this.adjList[w]) this.addVertex(w);

  this.adjList[v].push(w);
  this.adjList[w].push(v); // comment out this line if directed graph
};

// Print the graph
Graph.prototype.print = function() {
  for (var v in this.adjList) {
    console.log(v + " -> " + this.adjList[v].join(", "));
  }
};

// 13 Implement Prim's algorithm (use code from the book).
//    NOTE1: You do not need to use the code from (12) for this question.
//    NOTE2: Replace INF (used in the book) with Infinity.
function primMST(graph) {
  var V = graph.length;         
  var selected = new Array(V).fill(false); 
  var parent = new Array(V);          
  var key = new Array(V).fill(Infinity);   

  key[0] = 0; 
  parent[0] = -1; 

  for (var count = 0; count < V - 1; count++) {
    // Pick the minimum key vertex not yet included
    var u = minKey(key, selected);
    selected[u] = true;

    // Update key and parent for adjacent vertices
    for (var v = 0; v < V; v++) {
      if (graph[u][v] && !selected[v] && graph[u][v] < key[v]) {
        parent[v] = u;
        key[v] = graph[u][v];
      }
    }
  }

console.log("Edge / Weight")
  for (var i = 1; i < V; i++) {
    console.log(parent[i] + " - " + i + "\t" + graph[i][parent[i]]);
  }
}

// find vertex with minimum key not yet included
function minKey(key, selected) {
  var min = Infinity;
  var minIndex = -1;

  for (var v = 0; v < key.length; v++) {
    if (!selected[v] && key[v] < min) {
      min = key[v];
      minIndex = v;
    }
  }
  return minIndex;
}
