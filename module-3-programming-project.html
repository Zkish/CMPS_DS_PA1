// 1. Implement the linked list data structure using the prototype.

// Node constructor
function Node(value) {
  this.value = value;
  this.next = null;
}

// LinkedList constructor
function LinkedList() {
  this.head = null;
  this.length = 0;
}

// Append to end
LinkedList.prototype.append = function(value) {
  const newNode = new Node(value);

  if (!this.head) {
    this.head = newNode;
  } else {
    let current = this.head;
    while (current.next !== null) {
      current = current.next;
    }
    current.next = newNode;
  }
  this.length++;
};

// Prepend (add at beginning)
LinkedList.prototype.prepend = function(value) {
  const newNode = new Node(value);
  newNode.next = this.head;
  this.head = newNode;
  this.length++;
};

// Insert at index
LinkedList.prototype.insertAt = function(value, index) {
  if (index < 0 || index > this.length) return false;

  const newNode = new Node(value);

  if (index === 0) {
    this.prepend(value);
    return true;
  }

  let current = this.head;
  let previous = null;
  let i = 0;

  while (i < index) {
    previous = current;
    current = current.next;
    i++;
  }

  newNode.next = current;
  previous.next = newNode;
  this.length++;
  return true;
};

// Remove at index
LinkedList.prototype.removeAt = function(index) {
  if (index < 0 || index >= this.length) return null;

  let current = this.head;

  if (index === 0) {
    this.head = current.next;
    this.length--;
    return current.value;
  }

  let previous = null;
  let i = 0;

  while (i < index) {
    previous = current;
    current = current.next;
    i++;
  }

  previous.next = current.next;
  this.length--;
  return current.value;
};

// Remove by value
LinkedList.prototype.remove = function(value) {
  if (!this.head) return false;

  if (this.head.value === value) {
    this.head = this.head.next;
    this.length--;
    return true;
  }

  let current = this.head;
  let previous = null;

  while (current !== null && current.value !== value) {
    previous = current;
    current = current.next;
  }

  if (!current) return false; // value not found

  previous.next = current.next;
  this.length--;
  return true;
};

// Return index of value
LinkedList.prototype.indexOf = function(value) {
  let current = this.head;
  let index = 0;

  while (current !== null) {
    if (current.value === value) return index;
    current = current.next;
    index++;
  }
  return -1;
};

// Check if list is empty
LinkedList.prototype.isEmpty = function() {
  return this.length === 0;
};

// Get size
LinkedList.prototype.size = function() {
  return this.length;
};

// Print list as string
LinkedList.prototype.print = function() {
  let output = "";
  let current = this.head;
  while (current !== null) {
    output += current.value + " -> ";
    current = current.next;
  }
  console.log(output + "null");
};

// 3. Implement a getNodeAt(position) method (using the prototype) that returns
//    the node in a linked list at a given position (make sure to return the
//    node and not the element!).
LinkedList.prototype.getNodeAt = function(position) {
  if (position < 0 || position >= this.length) return null;

  let current = this.head;
  let index = 0;

  while (index < position) {
    current = current.next;
    index++;
  }

  return current; // return the node itself
};


// 4. Implement an appendNode(node) method (using the prototype) that appends a
//    node to a linked list (as opposed to an element!).
LinkedList.prototype.appendNode = function(node) {
  if (!node) return;

  if (!this.head) {
    this.head = node;
    // We don't know the exact length of the node chain unless we count
    let current = node;
    while (current !== null) {
      this.length++;
      current = current.next;
    }
    return;
  }

  let current = this.head;
  while (current.next !== null) {
    current = current.next;
  }

  // connect the chain
  current.next = node;

  // fix length
  while (node !== null) {
    this.length++;
    node = node.next;
  }
};
