// 1. Implement the ArrayList using the prototype.
// 1. ArrayList implementation using prototype
function ArrayList() {
  this.data = [];
  this.length = 0;
}

// Add an element at the end
ArrayList.prototype.add = function(element) {
  this.data[this.length] = element;
  this.length++;
};

// Get element at index
ArrayList.prototype.get = function(index) {
  if (index < 0 || index >= this.length) return null;
  return this.data[index];
};

// Remove element at index
ArrayList.prototype.removeAt = function(index) {
  if (index < 0 || index >= this.length) return null;
  const removed = this.data[index];
  for (let i = index; i < this.length - 1; i++) {
    this.data[i] = this.data[i + 1];
  }
  this.length--;
  this.data.length = this.length; // optional: shrink array
  return removed;
};

// 2. Create a non-sorted random array
function createNonSortedRandomArray(size) {
  const arr = new ArrayList();
  
  // Step 1: Fill array with 1..size
  for (let i = 1; i <= size; i++) {
    arr.add(i);
  }

  // Step 2: Shuffle using Fisher-Yates algorithm
  for (let i = size - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    // Swap arr[i] and arr[j]
    const temp = arr.get(i);
    arr.data[i] = arr.get(j);
    arr.data[j] = temp;
  }

  return arr;
}

function createNonSortedRandomArray(size) {
  const arr = new ArrayList();

  // Step 1: Fill array with numbers 1..size
  for (let i = 1; i <= size; i++) {
    arr.add(i);
  }

  // Step 2: Shuffle using Fisher-Yates algorithm
  for (let i = size - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    // Swap arr[i] and arr[j]
    const temp = arr.get(i);
    arr.data[i] = arr.get(j);
    arr.data[j] = temp;
  }

  return arr;
}

// 3. Implement the Quick Sort algorithm and test your code with the function
//    you wrote for (2).
// Quick Sort implementation for ArrayList
function quickSortArrayList(arr, left = 0, right = arr.length - 1) {
  if (left < right) {
    const pivotIndex = partition(arr, left, right);
    quickSortArrayList(arr, left, pivotIndex - 1);
    quickSortArrayList(arr, pivotIndex + 1, right);
  }
  return arr;
}

function partition(arr, left, right) {
  const pivot = arr.get(right); // choose last element as pivot
  let i = left - 1;

  for (let j = left; j < right; j++) {
    if (arr.get(j) <= pivot) {
      i++;
      // Swap arr[i] and arr[j]
      const temp = arr.get(i);
      arr.data[i] = arr.get(j);
      arr.data[j] = temp;
    }
  }

  // Swap pivot into correct position
  const temp = arr.get(i + 1);
  arr.data[i + 1] = arr.get(right);
  arr.data[right] = temp;

  return i + 1;
}

// 4. Implement searching using the prototype.

ArrayList.prototype.indexOf = function(element) {
  for (let i = 0; i < this.length; i++) {
    if (this.get(i) === element) {
      return i; // return first index where element is found
    }
  }
  return -1; // not found
};

// 5. Implement the binary search algorithm and test your code.

ArrayList.prototype.binarySearch = function(element) {
  let left = 0;
  let right = this.length - 1;

  while (left <= right) {
    const mid = Math.floor((left + right) / 2);
    const midVal = this.get(mid);

    if (midVal === element) {
      return mid;
    } else if (midVal < element) {
      left = mid + 1;
    } else {
      right = mid - 1;
    }
  }

  return -1; // not found
};

// Binary search (requires sorted array)
