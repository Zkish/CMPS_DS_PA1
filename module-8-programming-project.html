// 1. What is the worst case complexity of the following function?

// the worst case is that there are no duplicates , so every comparison runs O(n^2)

function hasDuplicates(arr) {
  for (var i = 0; i < arr.length; i++) {
    for (var j = 0; j < arr.length; j++) {
      if (i !== j && arr[i] === arr[j]) {
        return true;
      }
    }
  }
  return false;
}

// 3. The travelling salesman problem is a another classic problem and we are
//    going to solve it using a greedy algorithm. Before starting, please read

//PartA
// Graph distances
const distances = {
  A: { A: 0, B: 10, C: 15, D: 20 },
  B: { A: 10, B: 0, C: 35, D: 25 },
  C: { A: 15, B: 35, C: 0, D: 30 },
  D: { A: 20, B: 25, C: 30, D: 0 }
};

//PartB
function greedyTSP(distances, start) {
  const visitedOrder = [start];
  const cities = Object.keys(distances);
  const visited = {};
  visited[start] = true;

  let current = start;
  let totalDistance = 0;

  while (visitedOrder.length < cities.length) {
    let nextCity = null;
    let shortest = Infinity;

    for (let neighbor of cities) {
      if (!visited[neighbor] && distances[current][neighbor] < shortest) {
        shortest = distances[current][neighbor];
        nextCity = neighbor;
      }
    }

    visited[nextCity] = true;
    totalDistance += shortest;
    visitedOrder.push(nextCity);
    current = nextCity;
  }

  // Return to start
  totalDistance += distances[current][start];
  visitedOrder.push(start);

  return { route: visitedOrder, length: totalDistance };
}

// 4. Solve https://csacademy.com/contest/interview-archive/task/intersecting-rectangles/
//    What is the runtime complexity of your solution?
//    HINT: Try to break down the problems into smaller steps. For example,

// represent each rectangle
function Rectangle(x1, y1, x2, y2) {
  this.x1 = x1;
  this.y1 = y1;
  this.x2 = x2;
  this.y2 = y2;
}
// fucntion to test if two rectangles intersect
function intersects(r1, r2) {
  const xOverlap = Math.min(r1.x2, r2.x2) > Math.max(r1.x1, r2.x1);
  const yOverlap = Math.min(r1.y2, r2.y2) > Math.max(r1.y1, r2.y1);
  return xOverlap && yOverlap;
}

// count all intersecting pairs
function countIntersectingPairs(rectangles) {
  let count = 0;
  const n = rectangles.length;

  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      if (intersects(rectangles[i], rectangles[j])) {
        count++;
      }
    }
  }

  return count;
}
