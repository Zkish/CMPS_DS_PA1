    if (newNode.key < node.key) {
      // go to left
      if (node.left === null) {
        // no left node yet so assign
        node.left = newNode;
      }
      else {
        // move down tree and repeat
        insertNode(node.left, newNode);
      }
    }
    else {
      // go to right
      if (node.right === null) {
        // no right node yet so assign
        node.right = newNode;
      }
      else {
        // move down tree and repeat
        insertNode(node.right, newNode);
      }
    }
  }

  this.insert = function(key) {
    // insert new key in the tree
    var newNode = new Node(key);
    if (root === null) {

// No-prototype Binary Search Tree
  function BinarySearchTree() {
  function Node(key) {
    this.key = key;
    this.left = null;
    this.right = null;
  }

  let root = null;

  // Insert method
  this.insert = function(key) {
    const newNode = new Node(key);

    const insertNode = function(node, newNode) {
      if (newNode.key < node.key) {
        if (node.left === null) {
          node.left = newNode;
        } else {
          insertNode(node.left, newNode);
        }
      } else {
        if (node.right === null) {
          node.right = newNode;
        } else {
          insertNode(node.right, newNode);
        }
      }
    };

    if (root === null) {
      root = newNode;
    } else {
      insertNode(root, newNode);
    }
  };

  // In-order traversal
  this.inOrderTraverse = function(callback) {
    const inOrder = function(node) {
      if (node !== null) {
        inOrder(node.left);
        callback(node.key);
        inOrder(node.right);
      }
    };
    inOrder(root);
  };

  // Pre-order traversal
  this.preOrderTraverse = function(callback) {
    const preOrder = function(node) {
      if (node !== null) {
        callback(node.key);
        preOrder(node.left);
        preOrder(node.right);
      }
    };
    preOrder(root);
  };

  // Post-order traversal
  this.postOrderTraverse = function(callback) {
    const postOrder = function(node) {
      if (node !== null) {
        postOrder(node.left);
        postOrder(node.right);
        callback(node.key);
      }
    };
    postOrder(root);
  };

  // min method: returns minimum key
  this.min = function() {
    let node = root;
    if (node === null) return null; // empty tree
    while (node.left !== null) {
      node = node.left;
    }
    return node.key;
  };

  // max method: returns maximum key
  this.max = function() {
    let node = root;
    if (node === null) return null; // empty tree
    while (node.right !== null) {
      node = node.right;
    }
    return node.key;
  };

  // search method: returns true if key exists, false otherwise
  this.search = function(key) {
    const searchNode = function(node, key) {
      if (node === null) return false;
      if (key < node.key) return searchNode(node.left, key);
      else if (key > node.key) return searchNode(node.right, key);
      else return true; // key === node.key
    };
    return searchNode(root, key);
  };

  // Print the tree (simple in-order)
  this.print = function() {
    this.inOrderTraverse(console.log);
  };
}

// No-prototype Graph class
function Graph() {
  let vertices = {}; 

  // Add vertex
  this.addVertex = function(v) {
    if (!vertices[v]) {
      vertices[v] = [];
    }
  };

  // Add edge
  this.addEdge = function(v, w) {
    if (!vertices[v]) this.addVertex(v);
    if (!vertices[w]) this.addVertex(w);
    vertices[v].push(w);
  };

  // Print adjacency list
  this.print = function() {
    for (let v in vertices) {
      console.log(v + " -> " + vertices[v].join(", "));
    }
  };

  // ---------------------------
  // Breadth-First Search
  this.bfs = function(startVertex, callback) {
    let visited = {};
    let queue = [];

    visited[startVertex] = true;
    queue.push(startVertex);

    while (queue.length > 0) {
      let vertex = queue.shift();
      callback(vertex);

      vertices[vertex].forEach(function(neighbor) {
        if (!visited[neighbor]) {
          visited[neighbor] = true;
          queue.push(neighbor);
        }
      });
    }
  };

  // Depth-First Search recursive
  this.dfs = function(startVertex, callback) {
    let visited = {};

    const dfsVisit = (vertex) => {
      visited[vertex] = true;
      callback(vertex);

      vertices[vertex].forEach((neighbor) => {
        if (!visited[neighbor]) {
          dfsVisit(neighbor);
        }
      });
    };

    dfsVisit(startVertex);
  };
}
