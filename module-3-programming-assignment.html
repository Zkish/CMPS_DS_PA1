function LinkedList() {

  // helper class
  function Node(element) {
    this.element = element;
    this.next = null;
  }

  // store length and head
  var length = 0;
  var head = null;

  
  // Append to the end
 
  this.append = function(element) {
    var node = new Node(element);
    var current;

    if (head === null) {
      head = node;
    } else {
      current = head;
      while (current.next) {
        current = current.next;
      }
      current.next = node;
    }

    length++;
  };

 
  // Insert at a position
  
  this.insert = function(position, element) {
    if (position < 0 || position > length) {
      return false;
    }

    var node = new Node(element);
    var current = head;
    var previous;
    var index = 0;

    if (position === 0) {
      node.next = head;
      head = node;
    } else {
      while (index < position) {
        previous = current;
        current = current.next;
        index++;
      }
      node.next = current;
      previous.next = node;
    }

    length++;
    return true;
  };

  
  // Remove at position
 
  this.removeAt = function(position) {
    if (position < 0 || position >= length) {
      return null;
    }

    var current = head;
    var previous;
    var index = 0;

    if (position === 0) {
      head = current.next; // remove first node
    } else {
      while (index < position) {
        previous = current;
        current = current.next;
        index++;
      }
      previous.next = current.next; // skip node
    }

    length--;
    return current.element;
  };

 
  // Remove by value
 
  this.remove = function(element) {
    var index = this.indexOf(element);
    return this.removeAt(index);
  };

  
  // Get index of element

  this.indexOf = function(element) {
    var current = head;
    var index = 0;

    while (current) {
      if (current.element === element) {
        return index;
      }
      index++;
      current = current.next;
    }

    return -1;
  };

 
  // Check if empty
 
  this.isEmpty = function() {
    return length === 0;
  };

 
  // Return size
  
  this.size = function() {
    return length;
  };


  // Return head node
  
  this.getHead = function() {
    return head;
  };

  
  // Convert to string
  this.toString = function() {
    var current = head;
    var string = "List: ";
    while (current) {
      string += current.element + (current.next ? " -> " : "");
      current = current.next;
    }
    return string;
  };

  this.print = function() {
    console.log(this.toString());
  };

}

// 1. Write pseudo code (meaning; use comments) to describe how you would

// APPEND PSEUDO CODE:
//
// 1. Create a new node with the given element
// 2. Check if the list is empty (head === null)
//      - If yes, set head to the new node

// 2. Translate your pseudo code into actual code and test it.
//    HINT: Use list.print() to test your code.
this.append = function(element) {

  // STEP 1: Create a new node with the element
  var node = new Node(element);

  // STEP 2: If the list is empty, new node becomes the head
  if (head === null) {
    head = node;
  } else {

    // STEP 3: Otherwise, walk the list until current.next is null
    var current = head;

    while (current.next !== null) {
      current = current.next;   // move to next node
    }

    // STEP 4: Attach new node at the end
    current.next = node;
  }

  // STEP 5: Increase the list size
  length++;
};
