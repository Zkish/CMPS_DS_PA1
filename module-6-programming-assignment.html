console.log("The sorting algorithms");

// 1. Implement the ArrayList constructor.

function ArrayList() {
  let array = [];

  this.insert = function(item) {
    array.push(item);
  };

  this.toString = function() {
    return array.join(", ");
  };

  // swap helper
  const swap = function(array, index1, index2) {
    const temp = array[index1];
    array[index1] = array[index2];
    array[index2] = temp;
  };

  // Bubble Sort
  this.bubbleSort = function() {
    let length = array.length;
    for (let i = 0; i < length; i++) {
      for (let j = 0; j < length - 1 - i; j++) {
        if (array[j] > array[j + 1]) {
          swap(array, j, j + 1);
        }
      }
    }
  };

  // Selection Sort
  this.selectionSort = function() {
    let length = array.length;
    let indexMin;

    for (let i = 0; i < length - 1; i++) {
      indexMin = i;

      for (let j = i + 1; j < length; j++) {
        if (array[j] < array[indexMin]) {
          indexMin = j;
        }
      }

      if (i !== indexMin) {
        swap(array, i, indexMin);
      }
    }
  };

  // Sequential Search
  this.sequentialSearch = function(item) {
    for (let i = 0; i < array.length; i++) {
      if (array[i] === item) return i;
    }
    return -1;
  };
}

// 2. Implement the createNonSortedArray(size) function from the book.
// Create non-sorted array
function createNonSortedArray(size) {
  const array = new ArrayList();
  for (let i = size; i > 0; i--) {
    array.insert(i);
  }
  return array;
}

// 3. Implement Bubble Sort inside the ArrayList constructor and test your code.

arr1.bubbleSort();
